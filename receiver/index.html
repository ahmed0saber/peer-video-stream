<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Laptop Receiver</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
        }

        video {
            width: 90%;
            max-width: 600px;
            margin: 10px 0;
            border: 2px solid #333;
            border-radius: 8px;
        }

        input,
        button {
            padding: 8px;
            font-size: 16px;
            margin: 5px;
        }

        #fullscreenBtn {
            margin-top: 10px;
        }

        .fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: black;
            z-index: 9999;
            max-width: none;
            border: none;
            border-radius: 0;
            margin: 0;
        }
    </style>
</head>

<body>
    <h2>💻 Laptop Receiver</h2>
    <p>Enter your phone’s Peer ID:</p>
    <input id="peer-id" placeholder="Phone Peer ID">
    <button id="connectBtn">Connect and Wait for Video</button>
    <video id="remoteVideo" autoplay playsinline></video>
    <button id="fullscreenBtn"
        onclick="document.getElementById('remoteVideo').classList.add('fullscreen')">Fullscreen</button>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const peerIdInput = document.getElementById("peer-id");
        const connectBtn = document.getElementById("connectBtn");
        const remoteVideo = document.getElementById("remoteVideo");

        let peer = null;

        async function init() {
            // Get ICE servers
            const response = await fetch("https://ahmed0saber.metered.live/api/v1/turn/credentials?apiKey=d9de385a43810895240e9abce6377e2684df");
            const iceServers = await response.json();

            peer = new Peer({ config: { iceServers } });

            peer.on("error", err => console.error("PeerJS error:", err));

            peer.on("open", id => {
                console.log("My peer ID is:", id);
            });

            // Listen for incoming media calls from the phone
            peer.on("call", call => {
                console.log("Received a call from:", call.peer);
                // Answer the call without sending a local stream back
                call.answer();

                // Listen for the remote stream
                call.on("stream", remoteStream => {
                    console.log("Received remote stream");
                    remoteVideo.srcObject = remoteStream;
                });

                call.on("close", () => {
                    console.log("Call ended");
                    remoteVideo.srcObject = null;
                });
            });
        }

        connectBtn.addEventListener("click", () => {
            const phoneId = peerIdInput.value.trim();
            if (!phoneId) {
                return alert("Enter phone’s Peer ID");
            }
            // Initiates a data connection to the phone, which will then trigger the media call
            const dataConn = peer.connect(phoneId);
            dataConn.on("open", () => {
                console.log("Data connection to phone established. Waiting for video call...");
                connectBtn.textContent = "Connected! Waiting for video...";
                connectBtn.disabled = true;
            });
            dataConn.on("error", err => console.error("Data connection error:", err));
        });

        setTimeout(() => {
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const phoneIdFromUrl = urlParams.get('id');
            if (phoneIdFromUrl) {
                peerIdInput.value = phoneIdFromUrl;
                connectBtn.click();
                document.getElementById('remoteVideo').classList.add('fullscreen')
            }
        }, 1000);

        init();
    </script>
</body>

</html>
